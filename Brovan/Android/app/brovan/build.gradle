plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.brovan.app'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'dev.brovan.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DBROVAN_LIB_DIR=${projectDir}/src/main/jniLibs/arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../jni/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../java']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            // libBrovan.so and libunicorn.so are opened by name at runtime, so keep them on disk.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def keystore = System.getenv('BROVAN_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('BROVAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BROVAN_KEY_ALIAS')
                keyPassword System.getenv('BROVAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            // Theming builds widgets by class name through reflection, so R8 must not rename or drop them.
            minifyEnabled false
            // Without a release key the APK is signed like a debug build, so it installs over one.
            signingConfig System.getenv('BROVAN_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
