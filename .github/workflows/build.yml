name: Build Brovan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
            rid: win-x64
            archive_ext: zip

          - platform: Linux x64
            runner: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Brovan/Brovan.csproj

      - name: Publish
        run: dotnet publish Brovan/Brovan.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/publish/${{ matrix.rid }}

      - name: Build the BrovVulk Vulkan shim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Brovan.Graphics/brovvulk-icd/build.bat

      - name: Build the BrovVulk Vulkan shim (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sh Brovan.Graphics/brovvulk-icd/build.sh

      - name: Stage the Vulkan shim into the published VirtualFS
        shell: bash
        run: |
          shim="Brovan.Graphics/brovvulk-icd/bin"
          vfs="artifacts/publish/${{ matrix.rid }}/VirtualFS/C/Windows"

          for dll in "$shim/vulkan-1.dll" "$shim/x86/vulkan-1.dll"; do
            [ -f "$dll" ] || { echo "error: the Vulkan shim build produced no $dll" >&2; exit 1; }
          done

          mkdir -p "$vfs/System32" "$vfs/SysWOW64"
          cp -f "$shim/vulkan-1.dll" "$vfs/System32/vulkan-1.dll"
          cp -f "$shim/x86/vulkan-1.dll" "$vfs/SysWOW64/vulkan-1.dll"

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Brovan ${{ matrix.platform }}
          path: artifacts/publish/${{ matrix.rid }}
          retention-days: 14

  android:
    name: Build Android arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # A .NET 9 SDK is required even though the project targets net8.0: the source generator needs
      # Roslyn >= 4.10.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The NDK version has to match ndkVersion in Brovan/Android/app/brovan/build.gradle; the runner image
      # preinstalls a newer one that build-apk.sh would otherwise pick.
      - name: Install the Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: ~/brovan-toolchain/openssl-3.5.4
          key: brovan-openssl-3.5.4-android-arm64

      - name: Build OpenSSL for android-arm64
        run: bash Brovan/Android/build-openssl.sh

      - name: Cache Unicorn
        uses: actions/cache@v4
        with:
          path: Brovan/.cache/unicorn
          key: brovan-unicorn-android-arm64-${{ hashFiles('Brovan/Brovan.Unicorn.targets') }}

      - name: Build APK
        run: bash Brovan/Android/build-apk.sh

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Brovan Android arm64
          path: artifacts/android/*.apk
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts

      # upload-artifact drops the executable bit, so the apphost is made runnable again before the
      # tarball is rolled.
      - name: Package release archives
        run: |
          mkdir -p release-assets
          ( cd "release-artifacts/Brovan Windows x64" && zip -qr "$GITHUB_WORKSPACE/release-assets/Brovan-win-x64.zip" . )
          chmod +x "release-artifacts/Brovan Linux x64/Brovan"
          tar -C "release-artifacts/Brovan Linux x64" -czf release-assets/Brovan-linux-x64.tar.gz .
          cp release-artifacts/"Brovan Android arm64"/*.apk release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
